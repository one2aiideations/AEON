[workspace]
resolver = "2"
members = ["crates/mouli-hw", "crates/mouli-gate", "crates/mouli-identity", "crates/moulid", "crates/mouli-sched", "crates/mouli-neuro", "crates/mouli-mesh", "crates/mouli-web", "crates/mouli-forge", "crates/mouli-comms", "crates/mouli-store", "crates/mouli-mail", "crates/mouli-sheet", "crates/mouli-business", "crates/mouli-data", "crates/mouli-project", "crates/mouli-studio", "crates/mouli-system", "crates/mouli-topstar", "crates/mouli-llm", "crates/mouli-agentic", "crates/mouli-interface", "crates/mouli-auth", "crates/mouli-gateway", "crates/mouli-crm", "crates/mouli-crypto", "crates/mouli-pki", "crates/mouli-tls", "crates/mouli-http", "crates/mouli-hosted", "crates/mouli-biz", "crates/mouli-ops", "crates/mouli-update", "crates/mouli-security", "crates/mouli-sdv", "crates/mouli-code", "crates/mouli-screen", "crates/mouli-shell", "crates/mouli-lab", "crates/mouli-device", "crates/mouli-desk", "crates/mouli-apps", "crates/mouli-player"]

[workspace.package]
edition = "2021"
license = "LicenseRef-MOULI-undecided"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
