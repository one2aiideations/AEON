[workspace]
resolver = "2"
members = ["crates/mouli-hw", "crates/mouli-gate", "crates/mouli-gguf", "crates/mouli-tensor", "crates/mouli-model", "crates/mouli-engine", "crates/mouli-identity", "crates/mouli-cognition", "crates/mouli-runtime", "crates/mouli-adapters", "crates/moulid", "crates/mouli-theory", "crates/mouli-agents", "crates/mouli-sched", "crates/mouli-core", "crates/mouli-neuro", "crates/mouli-mesh", "crates/mouli-memory", "crates/mouli-web", "crates/mouli-forge", "crates/mouli-comms", "crates/mouli-store", "crates/mouli-orchestra", "crates/mouli-mail", "crates/mouli-sheet", "crates/mouli-business", "crates/mouli-data", "crates/mouli-project", "crates/mouli-studio", "crates/mouli-system", "crates/mouli-topstar", "crates/mouli-compress", "crates/mouli-quant", "crates/mouli-tokenizer", "crates/mouli-llm", "crates/mouli-interface", "crates/mouli-auth", "crates/mouli-gateway", "crates/mouli-crm", "crates/mouli-crypto", "crates/mouli-pki", "crates/mouli-tls", "crates/mouli-http", "crates/mouli-hosted", "crates/mouli-biz", "crates/mouli-ops", "crates/mouli-update", "crates/mouli-security"]

[workspace.package]
edition = "2021"
license = "LicenseRef-MOULI-undecided"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
