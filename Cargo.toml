[workspace]
resolver = "2"
members = ["crates/aeon-hw", "crates/aeon-gate", "crates/aeon-gguf", "crates/aeon-tensor", "crates/aeon-model", "crates/aeon-engine", "crates/aeon-identity", "crates/aeon-cognition", "crates/aeon-runtime", "crates/aeon-adapters", "crates/aeond", "crates/aeon-theory", "crates/aeon-agents", "crates/aeon-sched", "crates/aeon-core", "crates/aeon-neuro", "crates/aeon-mesh", "crates/aeon-memory", "crates/aeon-web", "crates/aeon-comms", "crates/aeon-store", "crates/aeon-orchestra", "crates/aeon-mail", "crates/aeon-sheet", "crates/aeon-studio"]

[workspace.package]
edition = "2021"
license = "LicenseRef-AEON-undecided"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
