name: MOULI OS image (build + QEMU boot test)

"on":
  push:
    branches:
      - main
    paths:
      - "os/**"
      - "crates/moulid/**"
      - "crates/mouli-hw/**"
      - ".github/workflows/os-image.yml"
  pull_request:
    paths:
      - "os/**"
      - "crates/moulid/**"
      - "crates/mouli-hw/**"
      - ".github/workflows/os-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mouli-os-image-${{ github.ref }}
  cancel-in-progress: true

env:
  BR_VERSION: "2026.02.3"
  # The version in the release folder name and documents (MOULI-OS-Release-v<version>).
  MOULI_RELEASE_VERSION: "1.2"
  BR2_DL_DIR: ${{ github.workspace }}/../br-dl

jobs:
  image:
    name: Build MOULI x86_64 image and boot it in QEMU
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: Free disk space (the Buildroot tree, caches and ISOs need tens of GB)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo apt-get clean
          df -h /

      - name: Install build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio unzip rsync wget file patch perl \
            python3 python3-pip qemu-system-x86 ccache grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools ovmf
          python3 -m pip install --user numpy gguf

      - name: Enable KVM when the runner offers it
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
            sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          fi
          ls -l /dev/kvm || echo "no KVM: QEMU will use TCG (slower)"

      - name: Cache Buildroot downloads and ccache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/../br-dl
            ~/.buildroot-ccache
          key: mouli-br-${{ env.BR_VERSION }}-${{ hashFiles('os/buildroot/**') }}
          restore-keys: |
            mouli-br-${{ env.BR_VERSION }}-

      - name: Install Rust with the musl target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools

      - name: Unit tests for moulid (host)
        run: cargo test --locked -p moulid -p mouli-hw

      - name: Tests for the release packaging (PDF writer and release folder script)
        run: python3 -m unittest discover -s os/release -v

      - name: Create the tiny test model
        run: python3 os/tools/make_tiny_gguf.py "$RUNNER_TEMP/mouli-tiny.gguf"

      - name: Build the image with Buildroot
        run: os/build.sh "$RUNNER_TEMP/buildroot" "$RUNNER_TEMP/mouli-out"

      - name: Show disk use after the build
        run: df -h /

      - name: Build the release ISO (no model; users bring their own)
        run: os/make-iso.sh "$RUNNER_TEMP/mouli-out" "$RUNNER_TEMP/mouli-out/images/mouli.iso"

      - name: Assemble the release folder (ISO, installation guide, checksums, release notes, licence)
        run: |
          os/release/make-release.sh "$RUNNER_TEMP/mouli-out/images/mouli.iso" "$RUNNER_TEMP/release" "$MOULI_RELEASE_VERSION"
          (cd "$RUNNER_TEMP/release/MOULI-OS-Release-v$MOULI_RELEASE_VERSION" && sha256sum -c 03-Verification/SHA256SUMS)
          if command -v pdftotext >/dev/null; then
            for f in 02-Installation-Guide/Installation-Guide.pdf 04-Release-Notes/Release-Notes.pdf; do
              pdftotext "$RUNNER_TEMP/release/MOULI-OS-Release-v$MOULI_RELEASE_VERSION/$f" - | grep -q "Chandra Mouli Krishna Moorthy"
            done
          fi

      - name: Check that the screen (not just the serial console) shows output, BIOS and UEFI
        run: |
          mkdir -p artifact
          python3 os/tools/screencheck.py "$RUNNER_TEMP/mouli-out/images/mouli.iso" bios artifact/screen-bios 100
          python3 os/tools/screencheck.py "$RUNNER_TEMP/mouli-out/images/mouli.iso" uefi artifact/screen-uefi 100

      - name: Build the test ISO (tiny model, serial console, self-test on boot)
        run: |
          MOULI_MODEL="$RUNNER_TEMP/mouli-tiny.gguf" MOULI_SERIAL=1 MOULI_CMDLINE="mouli.selftest=1" \
            os/make-iso.sh "$RUNNER_TEMP/mouli-out" "$RUNNER_TEMP/mouli-test.iso"

      - name: Build the Wi-Fi test ISO (two virtual radios, no model)
        run: |
          MOULI_SERIAL=1 MOULI_CMDLINE="mouli.wifitest=1 mac80211_hwsim.radios=2" \
            os/make-iso.sh "$RUNNER_TEMP/mouli-out" "$RUNNER_TEMP/mouli-wifi.iso"

      - name: Wi-Fi test - one virtual radio is an access point, the other scans and joins it
        run: |
          set -o pipefail
          ACCEL="-cpu max"; [ -w /dev/kvm ] && ACCEL="-enable-kvm -cpu host"
          timeout 600 qemu-system-x86_64 -M pc -m 2048 -smp 2 $ACCEL \
            -cdrom "$RUNNER_TEMP/mouli-wifi.iso" -boot d -nographic -no-reboot | tee boot-wifi.log || true
          grep -q "MOULI wifi: wlan0" boot-wifi.log
          grep -q "MOULI wifi test: PASS" boot-wifi.log

      - name: Boot the ISO in QEMU with BIOS firmware and run the MOULI self-test
        run: |
          set -o pipefail
          ACCEL="-cpu max"; [ -w /dev/kvm ] && ACCEL="-enable-kvm -cpu host"
          # A second disk holding an ext4 filesystem labelled MOULI-DATA: the OS must find it,
          # save a setting and a chat log there, and unmount it cleanly before power-off.
          DATA="$RUNNER_TEMP/mouli-data.img"
          truncate -s 32M "$DATA"
          mke2fs -q -F -t ext4 -L MOULI-DATA "$DATA"
          timeout 1500 qemu-system-x86_64 -M pc -m 2048 -smp 2 $ACCEL \
            -device ich9-ahci,id=ahci -drive if=none,id=data,file="$DATA",format=raw \
            -device ide-hd,drive=data,bus=ahci.0 -nic user,model=e1000 \
            -cdrom "$RUNNER_TEMP/mouli-test.iso" -boot d -nographic -no-reboot | tee boot-bios.log || true
          grep -q "Chandra Mouli Krishna Moorthy" boot-bios.log
          grep -q "cmklive@gmail.com" boot-bios.log
          grep -q "MOULI hardware:" boot-bios.log
          grep -q "MOULI ready" boot-bios.log
          grep -q "MOULI chat reply:" boot-bios.log
          grep -q "MOULI selftest: PASS" boot-bios.log
          grep -q "MOULI: saving settings and chat history to /mouli/data" boot-bios.log
          # QEMU's built-in network gives 10.0.2.15 with DNS 10.0.2.3 over DHCP (Intel e1000).
          grep -q "MOULI network: eth0 10.0.2.15/24, dns 10.0.2.3" boot-bios.log
          grep -q "MOULI data: saved settings and chat log" boot-bios.log
          # Read the disk back on the host: the data must really be on it.
          debugfs -R "cat /settings" "$DATA" | grep -q "^selftest=ok$"
          debugfs -R "cat /history/chat-0001.log" "$DATA" | grep -q "^user.hello MOULI$"
          e2fsck -n -f "$DATA"

      - name: Boot the ISO in QEMU with UEFI firmware and run the MOULI self-test
        run: |
          set -o pipefail
          OVMF="$(ls /usr/share/ovmf/OVMF.fd /usr/share/OVMF/OVMF.fd 2>/dev/null | head -1 || true)"
          [ -n "$OVMF" ] || { echo "no OVMF firmware found"; exit 1; }
          ACCEL="-cpu max"; [ -w /dev/kvm ] && ACCEL="-enable-kvm -cpu host"
          timeout 1500 qemu-system-x86_64 -M q35 -m 2048 -smp 2 $ACCEL -bios "$OVMF" -nic user,model=e1000e \
            -cdrom "$RUNNER_TEMP/mouli-test.iso" -boot d -nographic -no-reboot | tee boot-uefi.log || true
          grep -q "Chandra Mouli Krishna Moorthy" boot-uefi.log
          grep -q "cmklive@gmail.com" boot-uefi.log
          grep -q "MOULI hardware:" boot-uefi.log
          grep -q "MOULI ready" boot-uefi.log
          grep -q "MOULI chat reply:" boot-uefi.log
          grep -q "MOULI selftest: PASS" boot-uefi.log
          grep -q "nothing will be saved after power-off" boot-uefi.log
          # A second driver (Intel e1000e) on the UEFI machine.
          grep -q "MOULI network: eth0 10.0.2.15/24, dns 10.0.2.3" boot-uefi.log
          echo "The ISO booted under BIOS and UEFI, served a chat reply and passed the self-test"

      - name: Collect files to upload
        if: always()
        run: |
          mkdir -p artifact iso
          cp "$RUNNER_TEMP/mouli-out/images/mouli.iso" iso/ || true
          cp boot-bios.log boot-uefi.log artifact/ || true
          cp "$RUNNER_TEMP/mouli-out/images/bzImage" "$RUNNER_TEMP/mouli-out/images/rootfs.cpio.gz" artifact/ || true

      - name: Upload the release folder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MOULI-OS-Release-v${{ env.MOULI_RELEASE_VERSION }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the ISO (the only file you need for a USB stick)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mouli-iso
          path: iso/mouli.iso
          if-no-files-found: warn
          retention-days: 30

      - name: Upload boot logs, screenshots and parts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mouli-debug
          path: artifact/
          if-no-files-found: warn
          retention-days: 14
