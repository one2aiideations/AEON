[package]
name = "mouli-device"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MOULI-DEVICE: the controller that connects the on-device screens to the governed workspace (policy, approvals, audit chain) and to code review/apply. Not yet linked into moulid."

[features]
# Sheet, Studio and Player screens driven by their applications (out of the OS for now).
office = ["mouli-apps/office", "dep:mouli-player", "dep:mouli-studio"]

[dependencies]
mouli-screen = { path = "../mouli-screen" }
mouli-interface = { path = "../mouli-interface" }
mouli-code = { path = "../mouli-code" }
mouli-apps = { path = "../mouli-apps" }
mouli-systems = { path = "../mouli-systems", default-features = false, features = ["security"] }
serde_json = "1"
mouli-crypto = { path = "../mouli-crypto" }
mouli-player = { path = "../mouli-player", optional = true }
mouli-studio = { path = "../mouli-studio", optional = true }

[dev-dependencies]
tempfile = "3"
mouli-desk = { path = "../mouli-desk" }

[lints]
workspace = true

[[example]]
name = "desktop_apps"
required-features = ["office"]

[[example]]
name = "desktop_player"
required-features = ["office"]
