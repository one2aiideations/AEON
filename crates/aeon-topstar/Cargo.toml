[package]
name = "aeon-topstar"
version = "0.1.0"
description = "TOPSTAR core domain model for AEON: capabilities, responsibility, devices, protocol, sessions, execution records, journal, audit (from topstar-core)"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
uuid = { version = "1.18", features = ["serde", "v4"] }
