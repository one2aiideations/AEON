[package]
name = "mouli-system"
version = "0.1.0"
edition = "2021"
description = "MOULI-SYSTEM — AI-native universal operating-system control centre"

[dependencies]
eframe = { version = "0.29", default-features = true }
egui = "0.29"
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"

[lints]
workspace = true
