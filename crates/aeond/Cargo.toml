[package]
name = "aeond"
version = "0.1.0"
description = "AEON init (PID 1) and AI service supervisor"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aeon-hw = { path = "../aeon-hw" }
aeon-gguf = { path = "../aeon-gguf" }
aeon-http = { path = "../aeon-http" }
aeon-hosted = { path = "../aeon-hosted" }
aeon-interface = { path = "../aeon-interface" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "reboot", "hostname", "fs", "term"] }

[dev-dependencies]
aeon-pki = { path = "../aeon-pki" }

[lints]
workspace = true
