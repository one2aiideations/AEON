[package]
name = "mouli-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MOULI-SHELL: runs the mouli-screen interface on a Linux framebuffer and keyboard (framebuffer writer, console takeover, raw keyboard input, event loop)"

[dependencies]
mouli-screen = { path = "../mouli-screen" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["term", "poll", "fs"] }

[lints]
workspace = true
