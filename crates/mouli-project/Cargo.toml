[package]
name = "mouli-project"
version = "0.1.0"
description = "MOULI-PROJECT: local-first project management (tasks, dependencies, critical path, kanban, REST API, optional desktop UI)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Native desktop UI (eframe/egui). Off by default so headless builds and CI stay light.
gui = ["dep:eframe"]

[dependencies]
axum = "0.7"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
eframe = { version = "0.29", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
