[package]
name = "aeon-biz"
version = "0.13.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "AEON-BUSINESS monolith: local-first CRM/ERP core with a hash-chained audit log, a small decision model, finance ledger and a private peer network"

[[bin]]
name = "aeon-biz"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
ed25519-dalek = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[lints]
workspace = true
