[package]
name = "mouli-topstar"
version = "0.1.0"
description = "TOPSTAR core domain model for MOULI: capabilities, responsibility, devices, protocol, sessions, execution records, journal, audit (from topstar-core)"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
uuid = { version = "1.18", features = ["serde", "v4"] }

[lints.rust]
unsafe_code = "deny"
# Imported domain model: about 900 public items still lack doc comments. Tracked in docs/PLAN-100.md.
missing_docs = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
