[package]
name = "aeon-project"
version = "0.1.0"
edition = "2021"
description = "AEON-PROJECT — local-first AI-native project and work operating system"
license = "MIT"

[[bin]]
name = "aeon-project"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.29", default-features = true }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
