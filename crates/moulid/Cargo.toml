[package]
name = "moulid"
version = "0.1.0"
description = "MOULI init (PID 1) and AI service supervisor"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mouli-utility = { path = "../mouli-utility" }
mouli-llm = { path = "../mouli-llm" }
mouli-agentic = { path = "../mouli-agentic" }
mouli-http = { path = "../mouli-http" }
mouli-web = { path = "../mouli-web" }
mouli-hosted = { path = "../mouli-hosted" }
mouli-systems = { path = "../mouli-systems", default-features = false }
mouli-interface = { path = "../mouli-interface" }
sha2 = "0.10"
mouli-screen = { path = "../mouli-screen" }
mouli-desk = { path = "../mouli-desk" }
mouli-device = { path = "../mouli-device" }
mouli-apps = { path = "../mouli-apps", default-features = false }
mouli-update = { path = "../mouli-update" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "reboot", "hostname", "fs", "term", "signal"] }

[dev-dependencies]
mouli-pki = { path = "../mouli-pki" }
ed25519-dalek = "2"

[lints]
workspace = true
