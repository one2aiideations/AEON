[package]
name = "moulid"
version = "0.1.0"
description = "MOULI init (PID 1) and AI service supervisor"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
mouli-hw = { path = "../mouli-hw" }
mouli-gguf = { path = "../mouli-gguf" }
mouli-http = { path = "../mouli-http" }
mouli-hosted = { path = "../mouli-hosted" }
mouli-interface = { path = "../mouli-interface" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.29", features = ["mount", "reboot", "hostname", "fs", "term"] }

[dev-dependencies]
mouli-pki = { path = "../mouli-pki" }

[lints]
workspace = true
