[package]
name = "mouli-agentmem"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Agent-memory primitives (provenance, consolidation, decay, access control, audit journal, snapshot codec, replication log/merge/anti-entropy/repair/scheduler/dispatcher/wire/replay guard). std-only; adapted from the AgentOS m035-m053 sketches."

[dependencies]

[lints.rust]
unsafe_code = "deny"
# Adapted modules have self-explanatory field/variant names; documenting ~500 items is deferred.
missing_docs = "allow"

[lints.clippy]
all = { level = "deny", priority = -1 }
# Test fixtures in the adapted modules build configs by Default + field assignment.
field_reassign_with_default = "allow"
