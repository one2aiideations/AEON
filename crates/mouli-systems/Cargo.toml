[package]
name = "mouli-systems"
version = "0.1.0"
description = "MOULI-SYSTEMS: model gateway, identity, security, scheduler, state, integrations (TOPSTAR, comms, mesh), monitoring and billing in one crate"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Everything is on by default so `cargo test` covers it all. The OS image uses none of the
# optional parts (mouli-hosted asks for default-features = false).
default = ["topstar", "security", "comms", "identity", "auth", "mesh", "billing", "keys"]
topstar = ["dep:serde", "dep:serde_json", "dep:thiserror", "dep:sha2", "dep:uuid"]
security = ["dep:serde_json", "dep:sha2"]
comms = ["dep:chacha20poly1305", "dep:hkdf", "dep:sha2", "dep:x25519-dalek"]
identity = ["dep:ed25519-dalek", "dep:sha2"]
auth = ["dep:sha2"]
mesh = ["dep:sha2"]
billing = ["dep:sha2"]
keys = ["dep:chacha20poly1305", "dep:sha2"]

[dependencies]
mouli-interface = { path = "../mouli-interface" }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
thiserror = { version = "2.0", optional = true }
sha2 = { version = "0.10", optional = true }
uuid = { version = "1.18", features = ["serde", "v4"], optional = true }
hkdf = { version = "0.12", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
x25519-dalek = { version = "2", features = ["static_secrets"], optional = true }
ed25519-dalek = { version = "2", optional = true }

[lints]
workspace = true
