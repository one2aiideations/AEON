[package]
name = "aeon-studio"
version = "0.1.0"
edition = "2021"
description = "Local-first AI-native productivity and creative workspace"
license = "Apache-2.0"

[[bin]]
name = "aeon-studio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.29"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
